name: Pages · Codex review

on:
  push:
    branches: [codex-review]
  workflow_dispatch:

permissions:
  contents: read

# Share the original site's deployment lock: both workflows publish one Pages site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/codex-review'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out the original game
        uses: actions/checkout@v4
        with:
          ref: main
          path: sources/main
          persist-credentials: false

      - name: Check out the preview commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: sources/codex
          persist-credentials: false

      - name: Check out Claude's preview
        uses: actions/checkout@v4
        with:
          ref: claude/pensive-volta-et0etl
          path: sources/claude
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the original game
        working-directory: sources/main
        run: |
          npm ci
          npm run build

      - name: Check and build the preview
        working-directory: sources/codex
        run: |
          npm ci
          node tools/check-reach.mjs
          node --input-type=module <<'NODE'
          import { readdirSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';
          const checks = readdirSync('tools')
            .filter(name => /^check-.*\.mjs$/.test(name) && name !== 'check-collision.mjs')
            .sort().map(name => `tools/${name}`);
          const result = spawnSync(process.execPath, ['--test', ...checks], { stdio: 'inherit' });
          process.exit(result.status ?? 1);
          NODE
          npm run build

      - name: Build Claude's preview
        working-directory: sources/claude
        run: |
          npm ci
          npm run build

      - name: Assemble all three games in one site
        run: |
          mkdir -p site/codex site/claude
          cp -a sources/main/dist/. site/
          cp -a sources/codex/dist/. site/codex/
          cp -a sources/claude/dist/. site/claude/
          original_sha="$(git -C sources/main rev-parse HEAD)"
          preview_sha="$(git -C sources/codex rev-parse HEAD)"
          claude_sha="$(git -C sources/claude rev-parse HEAD)"
          printf '{"original":"%s","preview":"%s","claude":"%s"}\n' "$original_sha" "$preview_sha" "$claude_sha" > site/codex/build-info.json
          printf '{"main":"%s","claude":"%s","codex":"%s"}\n' "$original_sha" "$claude_sha" "$preview_sha" > site/claude/build-info.json
          test -s site/index.html
          test -s site/codex/index.html
          test -s site/codex/assets/apartment/scene.gltf
          test -s site/claude/index.html
          test -s site/claude/assets/apartment/scene.gltf

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}codex/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
